<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speaking & Writing — PTE</title><style>
:root{--bg:#f5f7fb;--surface:#fff;--ink:#111827;--muted:#667085;--line:#e6eaf0;--brand:#4f46e5;--brand2:#7c3aed;--soft:#f0efff;--good:#0f9f72;--warn:#b7791f;--shadow:0 14px 40px rgba(16,24,40,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button,a,input,textarea,select{font:inherit}button{cursor:pointer}.appbar{height:64px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:-.02em}.brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(79,70,229,.22)}.top-actions{display:flex;gap:8px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;font-size:12px}.btn.primary{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 7px 18px rgba(79,70,229,.18)}.btn.secondary{background:#fff;border:1px solid var(--line);color:#344054}.shell{max-width:1440px;margin:auto;padding:22px}.hero{background:linear-gradient(125deg,#171b3b,#3b2a83 55%,#6d28d9);color:#fff;border-radius:24px;padding:30px;box-shadow:0 18px 45px rgba(35,31,82,.18)}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;opacity:.7}.hero h1{font-size:32px;line-height:1.08;margin:8px 0}.hero p{max-width:700px;color:#dfe3ff;font-size:13px;line-height:1.7;margin:0}.section-title{display:flex;align-items:end;justify-content:space-between;margin:22px 0 10px}.section-title h2{margin:0;font-size:19px}.section-title p{margin:0;color:var(--muted);font-size:11px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.module{padding:18px}.module .icon{font-size:24px}.module h3{margin:10px 0 4px;font-size:16px}.module p{margin:0 0 15px;color:var(--muted);font-size:11px;line-height:1.5}.meta{display:flex;flex-wrap:wrap;gap:6px}.pill{padding:6px 9px;background:#f7f8fa;border:1px solid var(--line);border-radius:999px;font-size:10px;color:#475467;font-weight:800}.navlink{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;width:100%;margin-top:12px;padding:10px;border-radius:10px;background:var(--soft);color:#4438ca;font-size:11px;font-weight:900}.exam-grid{display:grid;grid-template-columns:1.6fr .8fr;gap:14px}.exam-card{padding:20px}.tabs{display:flex;gap:5px;overflow-x:auto;padding:5px;background:#fff;border:1px solid var(--line);border-radius:15px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:0;background:transparent;color:#667085;border-radius:10px;padding:10px 12px;font-size:11px;font-weight:900}.tab.active{background:#171b3b;color:#fff}.exam-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.exam-head h1{font-size:21px;margin:0}.exam-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.task-meta{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.task-meta .pill{background:#f8fafc}.prompt{background:#fbfcfe;border:1px solid var(--line);border-radius:16px;padding:22px;font-size:20px;line-height:1.65;min-height:220px;display:flex;align-items:center}.audio-box{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfcfe;margin:12px 0}.audio-box audio{width:100%}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.controls .btn{min-width:110px}.side-stack{display:grid;gap:12px}.side-card{padding:16px}.side-card h3{margin:0 0 8px;font-size:13px}.side-card p,.side-card li{font-size:11px;line-height:1.65;color:var(--muted)}.side-card ul{margin:0;padding-left:17px}.timer{font-size:34px;font-weight:900;letter-spacing:-.04em}.status{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:900;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:#98a2b3}.dot.live{background:#ef4444;box-shadow:0 0 0 5px #fee2e2}.transcript{min-height:115px;max-height:190px;overflow:auto;padding:13px;background:#101828;color:#e5e7eb;border-radius:14px;font-size:13px;line-height:1.6;margin-top:8px}.muted{color:var(--muted)}.hidden{display:none!important}.notice{padding:11px 13px;background:#fff8e8;border:1px solid #f5dfaa;color:#7a5a10;border-radius:12px;font-size:10px;line-height:1.5}.score-box{display:flex;align-items:center;justify-content:space-between;padding:15px;background:#f8f9ff;border:1px solid #e6e3ff;border-radius:14px}.score-number{font-size:28px;font-weight:900;color:#4338ca}.metric{margin-top:10px}.metric-row{display:flex;justify-content:space-between;font-size:10px;font-weight:800}.bar{height:6px;background:#eaecf0;border-radius:99px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0}.answer-box{width:100%;min-height:230px;border:1px solid var(--line);border-radius:14px;padding:14px;resize:vertical;outline:none}.answer-box:focus{border-color:#a7a1f8;box-shadow:0 0 0 3px #4f46e51a}.word-count{font-size:10px;color:var(--muted);text-align:right;margin-top:5px}.choice-grid{display:grid;gap:8px;margin-top:12px}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;font-size:12px;font-weight:750}.choice.selected{background:var(--soft);border-color:#9a91f7;color:#4338ca}.choice.correct{border-color:#8ad8c1;background:#effbf6}.choice.wrong{border-color:#f2a0a3;background:#fff3f3}.future{min-height:480px;display:grid;place-items:center;text-align:center;padding:30px}.future .big{font-size:50px}.future h2{margin:10px 0}.future p{max-width:520px;color:var(--muted);font-size:12px;line-height:1.7}.progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px}.stat small{font-size:10px;color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:5px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.exam-grid{grid-template-columns:1fr}.progress-grid{grid-template-columns:1fr 1fr}}@media(max-width:640px){.appbar{padding:0 12px}.brand{font-size:14px}.shell{padding:10px}.hero{padding:22px;border-radius:18px}.hero h1{font-size:26px}.cards{grid-template-columns:1fr}.exam-card,.side-card{padding:13px}.prompt{font-size:17px;min-height:190px;padding:16px}.tab{font-size:10px;padding:9px}.controls .btn{flex:1;min-width:0}.progress-grid{grid-template-columns:1fr}.top-actions .btn.secondary{display:none}}
</style></head><body>
<header class="appbar"><div class="brand"><div class="brandmark">P</div>Speaking & Writing</div><div class="top-actions"><a class="btn secondary" href="index.html" style="text-decoration:none">Dashboard</a></div></header>
<main class="shell"><div class="tabs" id="tabs"><button class="tab" data-key="personalIntroduction">👤 Personal Introduction</button><button class="tab" data-key="readAloud">📖 Read Aloud</button><button class="tab" data-key="repeatSentence">🎧 Repeat Sentence</button><button class="tab" data-key="describeImage">🖼️ Describe Image</button><button class="tab" data-key="retellLecture">🎤 Retell Lecture</button><button class="tab" data-key="answerShortQuestion">💬 Answer Short Question</button><button class="tab" data-key="summarizeGroupDiscussion">👥 Summarize Group Discussion</button><button class="tab" data-key="respondSituation">🎯 Respond to a Situation</button><button class="tab" data-key="summarizeWrittenText">📝 Summarize Written Text</button><button class="tab" data-key="essay">✍️ Write Essay</button></div><div id="loading" class="card exam-card">Loading exam module…</div><div id="exam" class="exam-grid hidden"><section class="card exam-card"><div class="exam-head"><div><div id="eyebrow" class="eyebrow" style="color:var(--brand)"></div><h1 id="title"></h1><p id="subtitle"></p></div><div class="status"><i id="dot" class="dot"></i><span id="status">Ready</span></div></div><div id="meta" class="task-meta"></div><div id="content"></div></section><aside class="side-stack"><div class="card side-card"><h3>Exam controls</h3><div class="timer" id="timer">00:00</div><p id="timerLabel" class="muted">Ready</p><div class="controls"><button id="start" class="btn primary">Start</button><button id="stop" class="btn secondary">Stop</button></div></div><div class="card side-card"><h3>Live transcript</h3><div id="transcript" class="transcript">Your speech will appear here while you speak.</div></div><div class="card side-card"><h3>💡 Exam tip</h3><p id="tip"></p><div id="note" class="notice"></div></div><div class="card side-card"><h3>Practice result</h3><div class="score-box"><div><div class="muted" style="font-size:10px">Practice score</div><div id="score" class="score-number">—</div></div><button id="evaluate" class="btn primary">Evaluate</button></div></div></aside></div></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbymQpTC6CSFF0o69qd440hN6TdUyXtaIXdKwcrxN3gqmi8_f6jOsBOKIVW5eWfb4P9VNA/exec';const META={"personalIntroduction": {"icon": "\ud83d\udc64", "label": "Personal Introduction", "meta": "25 sec prepare \u2022 30 sec response", "skills": "Unscored familiarization", "tip": "Get comfortable with the microphone and test flow.", "note": "Short personal response. This task does not contribute to your score."}, "readAloud": {"icon": "\ud83d\udcd6", "label": "Read Aloud", "meta": "6\u20137 questions \u2022 30\u201340 sec preparation", "skills": "Reading + Speaking", "tip": "Read the text naturally, clearly and without rushing.", "note": "Text is visible. Your response is recorded once."}, "repeatSentence": {"icon": "\ud83c\udfa7", "label": "Repeat Sentence", "meta": "10\u201312 questions \u2022 3\u20139 sec audio \u2022 15 sec response", "skills": "Listening + Speaking", "tip": "Listen first. Repeat exactly what you remember.", "note": "Reference text is hidden during exam mode."}, "describeImage": {"icon": "\ud83d\uddbc\ufe0f", "label": "Describe Image", "meta": "5\u20136 questions \u2022 25 sec preparation \u2022 40 sec response", "skills": "Speaking", "tip": "Describe the key features and relationships clearly.", "note": "Image is visible; keep a logical structure."}, "retellLecture": {"icon": "\ud83c\udfa4", "label": "Retell Lecture", "meta": "2\u20133 questions \u2022 up to 90 sec audio \u2022 40 sec response", "skills": "Listening + Speaking", "tip": "Capture the main idea and key supporting points.", "note": "Use your own words and keep speaking."}, "answerShortQuestion": {"icon": "\ud83d\udcac", "label": "Answer Short Question", "meta": "5\u20136 questions \u2022 3\u20139 sec audio \u2022 10 sec response", "skills": "Listening", "tip": "Give a short, accurate answer.", "note": "Do not add unnecessary detail."}, "summarizeGroupDiscussion": {"icon": "\ud83d\udc65", "label": "Summarize Group Discussion", "meta": "2\u20133 questions \u2022 up to 3 min audio \u2022 2 min response", "skills": "Listening + Speaking", "tip": "Capture each speaker's main contribution and connect the ideas.", "note": "Take notes while listening; speak continuously."}, "respondSituation": {"icon": "\ud83c\udfaf", "label": "Respond to a Situation", "meta": "2\u20133 questions \u2022 10 sec preparation \u2022 40 sec response", "skills": "Speaking", "tip": "Respond naturally and appropriately to the situation.", "note": "Read and listen, then give a clear spoken response."}, "summarizeWrittenText": {"icon": "\ud83d\udcdd", "label": "Summarize Written Text", "meta": "2 questions \u2022 10 min each", "skills": "Reading + Writing", "tip": "Write one clear sentence containing the main idea.", "note": "One sentence; maximum 75 words."}, "essay": {"icon": "\u270d\ufe0f", "label": "Write Essay", "meta": "1 question \u2022 20 minutes", "skills": "Writing", "tip": "Write a focused 200\u2013300 word essay.", "note": "Plan, develop your ideas, then check your response."}};let DATA={},task='readAloud',qs=[],idx=0,rec=null,recording=false,finalText='',interim='',started=0,timerId=null;
const $=id=>document.getElementById(id);
function jsonp(action){return new Promise((resolve,reject)=>{const cb='pte_'+Date.now(),s=document.createElement('script');const tm=setTimeout(()=>{s.remove();delete window[cb];reject(Error('Backend timeout'))},15000);window[cb]=d=>{clearTimeout(tm);delete window[cb];s.remove();resolve(d)};s.onerror=()=>{clearTimeout(tm);s.remove();delete window[cb];reject(Error('Backend connection failed'))};s.src=API_URL+'?action='+action+'&callback='+cb+'&t='+Date.now();document.body.appendChild(s)})}
async function init(){try{const d=await jsonp('speaking');DATA=d.speaking||{};$('loading').classList.add('hidden');$('exam').classList.remove('hidden');select('readAloud');setupSpeech()}catch(e){$('loading').textContent=e.message}}
function select(k){stopRec();task=k;idx=0;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.key===k));const m=META[k];$('eyebrow').textContent=m.skills;$('title').textContent=m.icon+' '+m.label;$('subtitle').textContent=m.meta;$('tip').textContent=m.tip;$('note').textContent=m.note;$('timer').textContent='00:00';$('timerLabel').textContent='Ready';$('score').textContent='—';render()}
function render(){qs=(DATA[task]&&DATA[task].questions)||[];if(!qs.length){$('content').innerHTML='<div class="future"><div><div class="big">'+META[task].icon+'</div><h2>No questions found</h2><p>Check the sheet name and data columns in your new Google Sheet. Use the Diagnose endpoint after deployment.</p></div></div>';return}const q=qs[idx];let h='<div class="muted" style="font-size:10px;margin:14px 0 6px">QUESTION '+(idx+1)+' OF '+qs.length+'</div>';
if(task==='repeatSentence'||task==='answerShortQuestion'||task==='retellLecture'||task==='summarizeGroupDiscussion'){if(q.audioUrl)h+='<div class="audio-box"><div class="muted" style="font-size:10px;margin-bottom:7px">QUESTION AUDIO</div><audio id="audio" controls preload="metadata" src="'+esc(q.audioUrl)+'"></audio></div>';}
if(task==='describeImage'&&q.imageUrl)h+='<div class="audio-box"><img src="'+esc(q.imageUrl)+'" alt="Question image" style="width:100%;max-height:390px;object-fit:contain;border-radius:10px"></div>';
if(task==='respondSituation'){h+='<div class="prompt">'+esc(q.text||q.prompt||q.question)+'</div>';}
else if(task==='readAloud'){h+='<div class="prompt">'+esc(q.text)+'</div>';}
else if(task==='repeatSentence'){h+='<div class="notice">🎧 Listen to the sentence. The reference text is hidden, just like exam mode.</div><div style="margin-top:8px"><button id="showRef" class="btn secondary">Show reference for practice</button><div id="ref" class="prompt hidden" style="margin-top:8px;font-size:16px">'+esc(q.text)+'</div></div>';}
else if(task==='answerShortQuestion'){h+='<div class="notice">🎧 Listen to the question and answer briefly. The model answer remains hidden until you choose to reveal it.</div><div style="margin-top:8px"><button id="showRef" class="btn secondary">Show answer for practice</button><div id="ref" class="notice hidden" style="margin-top:8px">'+esc(q.answer||q.text)+'</div></div>';}
else if(task==='retellLecture'||task==='summarizeGroupDiscussion'){h+='<div class="notice">🎧 Listen, take notes, then speak from memory. The reference is hidden during exam mode.</div><div style="margin-top:8px"><button id="showRef" class="btn secondary">Show reference for practice</button><div id="ref" class="prompt hidden" style="margin-top:8px;font-size:15px">'+esc(q.text)+'</div></div>';}
else if(task==='summarizeWrittenText'){h+='<div class="prompt" style="font-size:16px;min-height:260px">'+esc(q.text)+'</div><textarea id="answer" class="answer-box" placeholder="Write one sentence (maximum 75 words)…"></textarea><div class="word-count" id="wc">0 words</div>';}
else if(task==='essay'){h+='<div class="prompt" style="font-size:17px;min-height:180px">'+esc(q.text)+'</div><textarea id="answer" class="answer-box" placeholder="Write your 200–300 word essay…"></textarea><div class="word-count" id="wc">0 words</div>';}
h+='<div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="next" class="btn secondary">Next →</button><button id="reset" class="btn secondary">Reset</button></div>';$('content').innerHTML=h;
if($('showRef'))$('showRef').onclick=()=>$('ref').classList.toggle('hidden');
if($('answer'))$('answer').oninput=()=>$('wc').textContent=wordCount($('answer').value)+' words';
$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('next').onclick=()=>{if(idx<qs.length-1){idx++;render()}};$('reset').onclick=()=>{if($('answer'))$('answer').value='';finalText='';interim='';renderTranscript();$('score').textContent='—'}}
function setupSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('status').textContent='Use Chrome or Edge';return}rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-IN';rec.onstart=()=>{recording=true;started=Date.now();$('dot').classList.add('live');$('status').textContent='Recording';clearInterval(timerId);timerId=setInterval(()=>{$('timer').textContent=fmt(Math.floor((Date.now()-started)/1000))},250)};rec.onresult=e=>{let f=finalText,x='';for(let n=e.resultIndex;n<e.results.length;n++){const t=e.results[n][0].transcript;if(e.results[n].isFinal)f+=' '+t;else x+=' '+t}finalText=f.trim();interim=x.trim();renderTranscript()};rec.onerror=e=>{recording=false;$('status').textContent='Speech error: '+e.error;if(e.error==='not-allowed'||e.error==='service-not-allowed')alert('Microphone access is blocked. In Chrome: Site settings → Microphone → Allow for this GitHub Pages site, then reload.')};rec.onend=()=>{if(recording)try{rec.start()}catch(e){}else{$('dot').classList.remove('live');$('status').textContent='Ready'}}}
async function startRec(){if(!rec){alert('Speech Recognition is not available. Please use current Chrome or Edge.');return}finalText='';interim='';renderTranscript();try{rec.start();$('timerLabel').textContent='Speak now'}catch(e){$('status').textContent='Could not start'}}
function stopRec(){if(rec&&recording)try{recording=false;rec.stop()}catch(e){}clearInterval(timerId);$('dot').classList.remove('live');$('status').textContent='Ready'}
$('start').onclick=startRec;$('stop').onclick=stopRec;
function evaluate(){const q=qs[idx];if(!q)return;if(task==='summarizeWrittenText'||task==='essay'){const a=$('answer')?.value.trim()||'';if(!a)return alert('Write your answer first.');const words=wordCount(a);let score=task==='essay'?(words>=200&&words<=300?78:Math.max(45,Math.min(72,Math.round(words/3)))):(words>0?Math.min(80,50+Math.round(Math.min(words,75)/3)):0);$('score').textContent=score+'/90';save(task,q.id,q.text,a,score);return}const spoken=(finalText+' '+interim).trim();if(!spoken)return alert('Record your answer first.');const expected=tok(q.text||q.answer||'');const got=tok(spoken);const set=new Set(got);const hit=expected.filter(w=>set.has(w)).length;const score=expected.length?Math.max(0,Math.min(90,Math.round(hit/expected.length*90))):60;$('score').textContent=score+'/90';save(task,q.id,q.text,spoken,score)}
$('evaluate').onclick=evaluate;
function save(task,id,expected,response,score){fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({task:task,questionId:id,expectedText:expected,response:response,pteScore:score,words:wordCount(response)}),mode:'no-cors'}).catch(()=>{})}
function renderTranscript(){const t=(finalText+' '+interim).trim();$('transcript').textContent=t||'Your speech will appear here while you speak.'}
function tok(s){return String(s||'').toLowerCase().replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean)}function wordCount(s){return String(s||'').trim()?String(s).trim().split(/\s+/).length:0}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>select(b.dataset.key));init();
</script></body></html>
