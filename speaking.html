<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retell Lecture</title>
<style>
:root{--p:#5b3df5;--bg:#f6f7fb;--card:#fff;--line:#e7e9f2}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#172033}header{padding:18px 5%;color:#fff;background:linear-gradient(135deg,#3d2ab7,#7659ff)}header h1{margin:0;font-size:22px}.wrap{max-width:1200px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:1fr 330px;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 24px #1720330d}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--p);margin-bottom:8px}.question{font-size:17px;line-height:1.6}audio{width:100%;margin-top:14px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:white}.secondary{background:#f1efff;color:#4831bd;border:1px solid #ded8ff}.danger{background:#fff0f0;color:#b52f2f}.hidden{display:none!important}.panel{margin-top:13px;padding:15px;border:1px solid #ddd9ff;border-radius:16px;background:#faf9ff}.panel-title{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--p);margin-bottom:7px}.panel-text{white-space:pre-wrap;line-height:1.7}.box{min-height:120px;padding:13px;border:1px solid var(--line);border-radius:15px;background:#fafbfe;line-height:1.6}.status{font-size:13px;color:#687083;margin-top:8px}.score{font-size:34px;font-weight:900;color:var(--p)}.bar{height:8px;background:#edf0f6;border-radius:99px;margin:5px 0 12px}.fill{height:100%;background:linear-gradient(90deg,#5b3df5,#9b86ff);border-radius:99px}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>🎤 Retell Lecture</h1></header><div class="wrap"><div class="grid"><main class="card"><div class="label" id="counter"></div><div id="question" class="question">Loading…</div><audio id="audio" controls></audio><div id="audioStatus" class="status"></div><div class="controls"><button id="start" class="primary">🎙 Start Speaking</button><button id="stop" class="danger" disabled>■ Stop & Evaluate</button><button id="transcriptBtn" class="secondary">📜 Show Transcript</button><button id="solutionBtn" class="secondary">💡 Show Solution</button></div><div id="transcriptPanel" class="panel hidden"><div class="panel-title">Lecture Transcript</div><div id="transcriptText" class="panel-text"></div></div><div id="solutionPanel" class="panel hidden"><div class="panel-title">Model Answer / Solution</div><div id="solutionText" class="panel-text"></div></div><div class="controls"><button id="prev" class="secondary">← Previous</button><button id="next" class="secondary">Next →</button></div></main><aside><section class="card"><div class="label">Practice Result</div><div id="scoreText">Finish the task to see your score.</div><div id="metrics" class="hidden"><div>Content</div><div class="bar"><div id="content" class="fill"></div></div><div>Fluency</div><div class="bar"><div id="fluency" class="fill"></div></div><div>Pronunciation</div><div class="bar"><div id="pron" class="fill"></div></div></div></section><section class="card" style="margin-top:16px"><div class="label">Live Speech Transcript</div><div id="live" class="box">Get ready…</div><div id="speechStatus" class="status">Microphone is idle.</div></section></aside></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbymQpTC6CSFF0o69qd440hN6TdUyXtaIXdKwcrxN3gqmi8_f6jOsBOKIVW5eWfb4P9VNA/exec';const SHEET_NAME='Retell Lecture';let qs=[],i=0,rec,finalText='',interim='',running=false;const $=x=>document.getElementById(x);
async function load(){try{const r=await fetch(API_URL+'?sheet='+encodeURIComponent(SHEET_NAME)+'&t='+Date.now(),{cache:'no-store'});const d=await r.json();if(!d.ok)throw Error(d.error);qs=d.questions||[];if(!qs.length)throw Error('No Retell Lecture questions found');render()}catch(e){$('question').textContent='Backend connection failed: '+e.message}}
function render(){stopRec();const q=qs[i];$('counter').textContent='Question '+(i+1)+' of '+qs.length;$('question').textContent=q.question||q.text||'Listen and retell the lecture.';$('transcriptText').textContent=q.transcript||'No Transcript added in the sheet.';$('solutionText').textContent=q.answer||'No Answer added in the sheet.';$('transcriptPanel').classList.add('hidden');$('solutionPanel').classList.add('hidden');$('transcriptBtn').textContent='📜 Show Transcript';$('solutionBtn').textContent='💡 Show Solution';$('live').textContent='Get ready…';$('scoreText').textContent='Finish the task to see your score.';$('metrics').classList.add('hidden');if(q.audioUrl){$('audio').src=q.audioUrl;$('audio').style.display='block';$('audioStatus').textContent=''}else{$('audio').removeAttribute('src');$('audio').style.display='none';$('audioStatus').textContent='No Audio URL added yet.'}$('prev').disabled=i===0;$('next').disabled=i===qs.length-1}
$('transcriptBtn').onclick=()=>{const h=$('transcriptPanel').classList.toggle('hidden');$('transcriptBtn').textContent=h?'📜 Show Transcript':'🙈 Hide Transcript'};$('solutionBtn').onclick=()=>{const h=$('solutionPanel').classList.toggle('hidden');$('solutionBtn').textContent=h?'💡 Show Solution':'🙈 Hide Solution'};$('prev').onclick=()=>{if(i){i--;render()}};$('next').onclick=()=>{if(i<qs.length-1){i++;render()}};
function startRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('speechStatus').textContent='Speech recognition requires Google Chrome or Microsoft Edge.';return}rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';finalText='';interim='';running=true;rec.onresult=e=>{interim='';for(let x=e.resultIndex;x<e.results.length;x++){if(e.results[x].isFinal)finalText+=e.results[x][0].transcript+' ';else interim+=e.results[x][0].transcript}$('live').textContent=(finalText+' '+interim).trim()||'Listening…'};rec.onerror=e=>$('speechStatus').textContent='Speech recognition: '+e.error;rec.onend=()=>{if(running)try{rec.start()}catch(e){}};try{rec.start();$('start').disabled=true;$('stop').disabled=false;$('speechStatus').textContent='Listening…'}catch(e){}}
function stopRec(){running=false;if(rec)try{rec.stop()}catch(e){}$('start').disabled=false;$('stop').disabled=true}
function evaluate(){const spoken=(finalText+' '+interim).trim();const model=(qs[i].answer||qs[i].transcript||'').toLowerCase().match(/[a-z']+/g)||[];const words=spoken.toLowerCase().match(/[a-z']+/g)||[];const set=new Set(model);const hit=words.filter(w=>set.has(w)).length;const c=spoken?Math.min(90,Math.max(15,Math.round(25+65*hit/Math.max(1,Math.min(model.length,words.length))))):0;const f=spoken?Math.min(90,Math.max(20,Math.round(35+words.length*.7))):0;const p=spoken?Math.min(90,Math.max(20,Math.round(45+words.length*.6))):0;const total=Math.round((c+f+p)/3);$('scoreText').innerHTML='<div class="score">'+total+'%</div><div class="status">Practice estimate only — not an official PTE score.</div>';$('metrics').classList.remove('hidden');$('content').style.width=c+'%';$('fluency').style.width=f+'%';$('pron').style.width=p+'%'}
$('start').onclick=startRec;$('stop').onclick=()=>{stopRec();evaluate()};load();
</script></body></html>
